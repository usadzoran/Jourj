<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>JOUR J — LE MOMENT QU'ON ATTEND</title>
    <meta name="description" content="JOUR J — Tout pour préparer votre grand jour au même endroit. Oran, Algérie." />
    
    <!-- PWA & Mobile Meta -->
    <meta name="theme-color" content="#080808" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JOUR J" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts: Cinzel, Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
      :root {
        --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        --font-luxury: 'Cinzel', 'Playfair Display', Georgia, serif;
        --font-serif: 'Playfair Display', Georgia, serif;
      }
      body {
        font-family: var(--font-body);
        background-color: #080808;
        color: #F7F3EA;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }
      .font-luxury {
        font-family: var(--font-luxury);
      }
      .font-serif {
        font-family: var(--font-serif);
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: #080808;
      }
      ::-webkit-scrollbar-thumb {
        background: #D7B45A;
        border-radius: 4px;
      }
    </style>
  </head>
  <body class="bg-[#080808] text-[#F7F3EA] antialiased selection:bg-[#D7B45A] selection:text-[#080808]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
